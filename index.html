const SOAL=[{"q": "Rizal, siswa SMA di Teluk Ambon, berlari di pantai dan tanpa sengaja menginjak pecahan karang tajam. Kakinya langsung terangkat dan baru beberapa saat kemudian ia merasakan nyeri yang hebat. Gerakan cepat itu terjadi tanpa ia sempat memikirkannya terlebih dahulu.\n\nJalur penghantaran impuls yang paling tepat untuk menjelaskan respons kaki Rizal adalah .....", "o": ["Reseptor nyeri di kulit → neuron motorik → otak → neuron sensorik → otot tungkai", "Reseptor nyeri di kulit → neuron sensorik → sumsum tulang belakang → neuron motorik → otot tungkai", "Reseptor nyeri di kulit → neuron sensorik → otak → neuron motorik → otot tungkai", "Otot tungkai → neuron sensorik → sumsum tulang belakang → neuron motorik → reseptor nyeri di kulit", "Reseptor nyeri di kulit → neuron motorik → sumsum tulang belakang → neuron sensorik → otot tungkai"], "k": 1}, {"q": "Seorang nelayan di perairan Laut Banda sedang menarik jaring ketika seekor hiu tiba-tiba mendekati perahunya. Seketika jantungnya berdebar kencang, napasnya memburu, pupil matanya melebar, dan tubuhnya terasa penuh tenaga untuk segera menjauh dari bahaya.\n\nKeterkaitan sistem organ yang paling tepat dalam menjelaskan respons nelayan tersebut adalah .....", "o": ["Sistem saraf parasimpatis mengaktifkan pankreas sehingga insulin meningkat dan kadar glukosa darah turun", "Hipofisis posterior melepaskan ADH sehingga ginjal menyerap lebih banyak air dan denyut jantung menurun", "Kelenjar tiroid melepaskan kalsitonin sehingga kadar kalsium darah turun dan otot rangka menjadi rileks", "Sistem saraf simpatis merangsang medula adrenal melepaskan adrenalin sehingga denyut jantung dan laju napas meningkat serta kadar glukosa darah naik", "Sistem saraf parasimpatis merangsang kelenjar ludah dan lambung sehingga pencernaan meningkat dan denyut jantung melambat"], "k": 3}, {"q": "Pada pertandingan sepak bola antardesa di tepi Pantai Namalatu pukul 13.00 WIT, suhu udara mencapai 34 °C. Para pemain tampak berkeringat deras dan kulit wajah mereka memerah, tetapi suhu inti tubuh mereka tetap berada di kisaran normal.\n\nPernyataan yang paling tepat tentang keterkaitan sistem organ dalam menjaga suhu tubuh para pemain adalah .....", "o": ["Termoreseptor mengirim impuls ke hipotalamus, lalu hipotalamus memicu kelenjar keringat berproduksi dan pembuluh darah kulit melebar sehingga panas tubuh dilepaskan", "Hipotalamus memicu pembuluh darah kulit menyempit dan otot rangka menggigil sehingga panas tubuh dilepaskan ke lingkungan", "Termoreseptor mengirim impuls ke serebelum, lalu serebelum merangsang kelenjar tiroid meningkatkan metabolisme sehingga suhu tubuh turun", "Hipotalamus menurunkan denyut jantung dan menghentikan sekresi keringat agar air tubuh dihemat dan suhu tubuh turun", "Kulit menyerap panas lingkungan melalui pembuluh darah yang menyempit sehingga suhu inti tubuh tetap dipertahankan"], "k": 0}, {"q": "Dalam lomba lari 5 km di Masohi, seorang atlet merasakan napasnya semakin cepat dan dalam, serta denyut jantungnya meningkat setelah berlari beberapa menit. Otot-ototnya yang aktif menghasilkan banyak karbon dioksida (CO₂) yang larut dalam darah sehingga pH darah cenderung turun.\n\nUrutan respons yang tepat terhadap peningkatan kadar CO₂ dalam darah atlet tersebut adalah .....", "o": ["CO₂ darah naik → kemoreseptor → serebelum → kontraksi otot jantung melemah → laju napas melambat", "CO₂ darah naik → paru-paru melepaskan hormon → hipofisis → ginjal → laju napas meningkat", "CO₂ darah naik → kemoreseptor → medula oblongata → otot diafragma dan otot antartulang rusuk lebih sering berkontraksi → CO₂ dikeluarkan lebih banyak", "CO₂ darah naik → termoreseptor → hipotalamus → kelenjar keringat → laju napas meningkat", "CO₂ darah naik → reseptor sentuhan → sumsum tulang belakang → otot polos bronkus berkontraksi → saluran napas menyempit"], "k": 2}, {"q": "Pak Ahmad, seorang petani cengkeh di Pulau Seram, bekerja seharian di kebun tanpa minum. Sore harinya ia merasa sangat haus. Urine yang ia keluarkan berwarna kuning pekat dan jumlahnya sedikit, padahal biasanya ia buang air kecil dalam jumlah normal.\n\nMekanisme yang menghubungkan sistem saraf, sistem endokrin, dan sistem ekskresi pada kondisi Pak Ahmad adalah .....", "o": ["Plasma darah encer dideteksi hipotalamus, hipofisis anterior melepaskan ADH, ginjal menyerap lebih sedikit air sehingga urine sedikit dan pekat", "Pankreas melepaskan lebih banyak insulin sehingga filtrasi glomerulus meningkat dan urine menjadi sedikit serta pekat", "Plasma darah pekat dideteksi medula oblongata, kelenjar adrenal melepaskan adrenalin, ginjal menahan garam sehingga urine menjadi banyak dan encer", "Plasma darah pekat dideteksi hipotalamus, hipofisis posterior melepaskan ADH, permeabilitas ginjal terhadap air menurun sehingga urine menjadi banyak dan encer", "Plasma darah pekat dideteksi hipotalamus, hipofisis posterior melepaskan ADH, tubulus distal dan duktus pengumpul menyerap lebih banyak air sehingga urine sedikit dan pekat"], "k": 4}, {"q": "Setelah menyantap papeda dengan ikan kuah kuning, kadar glukosa dalam darah seorang siswa meningkat. Beberapa jam kemudian kadar glukosa darahnya kembali ke kisaran normal. Hal ini menunjukkan adanya kerja sama sistem pencernaan, sistem peredaran darah, dan sistem endokrin.\n\nRespons tubuh yang paling tepat untuk mengembalikan kadar glukosa darah ke kisaran normal adalah .....", "o": ["Sel alfa pankreas menyekresi glukagon sehingga hati mengubah glikogen menjadi glukosa", "Sel beta pankreas menyekresi insulin sehingga sel tubuh menyerap glukosa dan hati serta otot mengubahnya menjadi glikogen", "Kelenjar adrenal menyekresi kortisol sehingga hati mengubah lemak menjadi glukosa dan kadar glukosa darah naik", "Kelenjar tiroid menyekresi tiroksin sehingga sel berhenti menyerap glukosa dari darah", "Usus halus menghentikan penyerapan glukosa karena dirangsang saraf simpatis sehingga glukosa keluar bersama feses"], "k": 1}, {"q": "Seorang anak keluar dari ruangan yang gelap menuju halaman sekolah pada siang hari yang terik. Matanya terasa silau, tetapi beberapa saat kemudian pupilnya mengecil dan ia dapat melihat dengan nyaman.\n\nKeterkaitan sistem organ yang menjelaskan perubahan ukuran pupil tersebut adalah .....", "o": ["Cahaya terang diterima kornea, impuls dihantarkan ke serebelum, lalu otot radial iris berkontraksi sehingga pupil mengecil", "Cahaya terang diterima lensa, impuls dihantarkan ke medula spinalis, lalu otot siliaris berkontraksi sehingga pupil mengecil", "Cahaya terang diterima retina, impuls dihantarkan ke otak, lalu saraf simpatis merangsang otot sfingter iris sehingga pupil mengecil", "Cahaya terang diterima fotoreseptor pada retina, impuls dihantarkan melalui saraf optik ke otak tengah, lalu saraf parasimpatis merangsang otot sfingter iris berkontraksi sehingga pupil mengecil", "Cahaya terang diterima koroid, impuls dihantarkan ke hipotalamus, lalu kelenjar air mata menyekresi cairan sehingga pupil mengecil"], "k": 3}, {"q": "Seorang siswa terserang infeksi bakteri. Sebelum demamnya mencapai 39 °C, ia merasa kedinginan dan menggigil hebat meskipun suhu tubuhnya terus naik. Setelah diberi obat penurun demam dan berkeringat, suhu tubuhnya perlahan kembali normal.\n\nPenjelasan yang paling tepat tentang menggigilnya siswa tersebut adalah .....", "o": ["Zat pirogen menaikkan titik patokan suhu di hipotalamus, sehingga suhu tubuh dianggap terlalu rendah dan hipotalamus memicu otot rangka menggigil serta pembuluh darah kulit menyempit untuk menambah panas", "Zat pirogen menurunkan titik patokan suhu di hipotalamus sehingga tubuh melepaskan panas melalui otot rangka yang menggigil", "Bakteri langsung merusak otot rangka sehingga otot berkontraksi tanpa perintah dari sistem saraf", "Kelenjar tiroid menurunkan metabolisme sehingga suhu tubuh turun dan otot rangka menggigil", "Kelenjar keringat berhenti bekerja sehingga pembuluh darah kulit melebar dan otot rangka menggigil"], "k": 0}, {"q": "Seorang penari cakalele melompat, berputar, dan mengayunkan parang serta salawaku mengikuti irama tifa tanpa kehilangan keseimbangan. Ia tetap tegak meskipun posisi kepalanya terus berubah dengan cepat.\n\nKeterkaitan sistem organ yang paling tepat dalam menjaga keseimbangan penari tersebut adalah .....", "o": ["Kulit mendeteksi perubahan posisi kepala, impuls dikirim ke korteks motorik, lalu otot polos menggerakkan rangka", "Koklea mendeteksi perubahan posisi kepala, impuls dikirim ke hipotalamus, lalu kelenjar endokrin mengatur posisi tubuh", "Retina mendeteksi perubahan posisi kepala, impuls dikirim ke medula oblongata, lalu otot jantung menggerakkan rangka", "Gendang telinga mendeteksi perubahan posisi kepala, impuls dikirim ke talamus, lalu tulang rangka menggerakkan otot", "Organ keseimbangan di telinga dalam mendeteksi perubahan posisi kepala, impuls melalui saraf vestibular dikirim ke serebelum, lalu neuron motorik mengaktifkan otot rangka untuk menggerakkan rangka dan menyeimbangkan tubuh"], "k": 4}, {"q": "Seorang tukang kayu di Masohi terluka cukup dalam akibat sayatan parang dan kehilangan banyak darah. Tekanan darahnya menurun, tetapi beberapa saat kemudian denyut jantungnya meningkat dan kulitnya tampak pucat karena pembuluh darah di kulit menyempit.\n\nMekanisme yang paling tepat untuk menjelaskan respons tubuh tersebut adalah .....", "o": ["Tekanan darah turun merangsang kemoreseptor di paru-paru, lalu saraf parasimpatis memperlambat denyut jantung dan melebarkan pembuluh darah", "Tekanan darah turun merangsang termoreseptor di kulit, lalu kelenjar keringat menyekresi cairan sehingga tekanan darah naik", "Tekanan darah turun dideteksi baroreseptor pada lengkung aorta dan sinus karotis, impuls dikirim ke medula oblongata, lalu saraf simpatis meningkatkan denyut jantung dan menyempitkan pembuluh darah sehingga tekanan darah naik", "Tekanan darah turun dideteksi baroreseptor di ginjal, impuls dikirim ke serebelum, lalu saraf somatik menggerakkan otot rangka untuk memompa darah", "Tekanan darah turun dideteksi osmoreseptor di hipotalamus, lalu pankreas menyekresi insulin sehingga pembuluh darah menyempit"], "k": 2}, {"q": "Sekelompok pendaki mendaki Gunung Binaiya di Pulau Seram selama beberapa hari. Pada ketinggian di atas 2.000 meter, tekanan parsial oksigen (O₂) lebih rendah. Pada awalnya mereka cepat lelah dan napasnya terengah-engah, tetapi setelah beberapa hari tubuh mereka mulai beradaptasi.\n\nKerja sama sistem organ yang paling tepat dalam adaptasi tubuh terhadap rendahnya kadar O₂ tersebut adalah .....", "o": ["Hati mendeteksi kadar O₂ rendah, lalu menyekresi insulin yang merangsang pembentukan sel darah putih di limpa", "Ginjal mendeteksi kadar O₂ darah rendah, lalu menyekresi eritropoietin yang merangsang sumsum tulang merah membentuk lebih banyak eritrosit sehingga daya angkut O₂ meningkat", "Lambung mendeteksi kadar O₂ rendah, lalu menyekresi gastrin yang merangsang sumsum tulang kuning membentuk trombosit", "Pankreas mendeteksi kadar O₂ rendah, lalu menyekresi glukagon yang merangsang limpa membentuk lebih banyak eritrosit", "Kulit mendeteksi kadar O₂ rendah, lalu menyekresi keringat yang merangsang sumsum tulang membentuk lebih banyak leukosit"], "k": 1}, {"q": "Ketika mencium aroma sagu bakar dan ikan asap yang baru diangkat dari tungku, seorang anak merasa mulutnya berair. Air liur yang keluar mengandung enzim amilase yang membantu pencernaan sagu yang kaya amilum.\n\nKeterkaitan sistem organ dalam peristiwa tersebut yang paling tepat adalah .....", "o": ["Kemoreseptor di lidah menerima aroma, impuls dikirim ke serebelum, lalu saraf simpatis merangsang kelenjar ludah menyekresi amilase", "Kemoreseptor di kulit menerima aroma, impuls dikirim ke sumsum tulang belakang, lalu hormon gastrin merangsang kelenjar ludah", "Reseptor di hidung menerima aroma, impuls dikirim ke hipofisis, lalu hormon tiroksin merangsang kelenjar ludah menyekresi amilase", "Kemoreseptor di epitel olfaktori hidung menerima aroma, impuls dikirim melalui saraf olfaktori ke otak, lalu saraf parasimpatis merangsang kelenjar ludah menyekresi saliva yang mengandung amilase untuk memecah amilum menjadi maltosa", "Kemoreseptor di hidung menerima aroma, impuls dikirim ke otak, lalu lambung menyekresi amilase yang masuk ke mulut melalui kerongkongan"], "k": 3}, {"q": "Seorang ibu menyusui bayinya di rumah. Ketika bayi mengisap puting, ASI mengalir keluar dari kelenjar susu. Mengisap puting merupakan rangsangan yang menghubungkan sistem saraf, sistem endokrin, dan sistem reproduksi pada ibu.\n\nAlur respons yang paling tepat sehingga ASI dapat keluar adalah .....", "o": ["Isapan bayi merangsang reseptor di puting, impuls dikirim ke hipotalamus, hipofisis posterior melepaskan oksitosin, dan sel otot di sekitar alveolus kelenjar susu berkontraksi sehingga ASI keluar", "Isapan bayi merangsang reseptor di puting, impuls dikirim ke serebelum, hipofisis posterior melepaskan prolaktin, dan sel otot di sekitar alveolus berkontraksi sehingga ASI keluar", "Isapan bayi merangsang reseptor di puting, impuls dikirim ke medula oblongata, ovarium melepaskan estrogen, dan kelenjar susu berkontraksi sehingga ASI keluar", "Isapan bayi merangsang kelenjar adrenal, adrenalin dilepaskan ke darah, dan alveolus kelenjar susu berkontraksi sehingga ASI keluar", "Isapan bayi merangsang reseptor di puting, impuls dikirim ke hipotalamus, hipofisis anterior melepaskan FSH, dan ovarium menyekresi ASI"], "k": 0}, {"q": "Seorang nelayan sering mengalami kram otot setelah melaut karena kadar kalsium dalam darahnya menurun. Kondisi ini dapat kembali normal karena adanya kerja sama sistem endokrin, sistem rangka, sistem ekskresi, dan sistem otot.\n\nRespons tubuh yang paling tepat untuk mengembalikan kadar kalsium darah ke kisaran normal adalah .....", "o": ["Kelenjar tiroid menyekresi kalsitonin sehingga tulang melepaskan kalsium ke darah dan otot rangka berkontraksi normal", "Kelenjar adrenal menyekresi aldosteron sehingga ginjal membuang kalsium leb
